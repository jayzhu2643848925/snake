<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07101e" />
    <title>蛇域竞技场</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="蛇域竞技场主页">
          <span class="brand-mark">S</span>
          <span>蛇域<span>竞技场</span></span>
        </a>
        <div class="game-status"><i></i><span id="statusText">竞技场已连接</span></div>
        <button class="sound-button" id="soundButton" type="button" aria-label="切换音效">♪</button>
      </header>

      <section class="game-layout">
        <aside class="sidebar left-panel">
          <div class="panel-heading"><span>战场情报</span><b>LIVE</b></div>
          <div class="rank-list" id="rankList"></div>
          <div class="divider"></div>
          <div class="stat-grid">
            <div class="stat-card"><span>当前长度</span><strong id="lengthValue">5</strong></div>
            <div class="stat-card"><span>最高纪录</span><strong id="bestValue">0</strong></div>
          </div>
          <div class="divider"></div>
          <div class="tip"><span class="tip-icon">✦</span><p>吃掉能量块来成长，避免撞上其他蛇的身体。</p></div>
        </aside>

        <section class="arena-wrap">
          <div class="arena-frame">
            <canvas id="gameCanvas" width="960" height="640" aria-label="贪吃蛇竞技场"></canvas>
            <div class="game-overlay" id="gameOverlay">
              <div class="overlay-card">
                <span class="eyebrow">SNAKE ARENA</span>
                <h1>蛇域竞技场</h1>
                <p>在霓虹战场中生存、成长、称霸排行榜。</p>
                <div class="difficulty-picker" role="group" aria-label="选择游戏难度">
                  <button class="difficulty active" data-difficulty="easy" type="button">新手</button>
                  <button class="difficulty" data-difficulty="normal" type="button">标准</button>
                  <button class="difficulty" data-difficulty="hard" type="button">极限</button>
                </div>
                <button id="startButton" class="primary-button" type="button">开始战斗 <span>→</span></button>
                <div class="key-hint"><span>拖动轮盘，360° 自由转向</span></div>
              </div>
            </div>
            <div class="hud score-hud"><span>得分</span><strong id="scoreValue">0000</strong></div>
            <div class="hud kill-hud"><span>击败</span><strong id="killsValue">0</strong></div>
            <div class="mini-map"><canvas id="miniMap" width="132" height="88"></canvas><span>雷达</span></div>
          </div>
          <div class="wheel-controls" id="directionWheel" aria-label="360 度方向轮盘">
            <span class="wheel-label">360° 控制</span>
            <i class="wheel-axis axis-x"></i><i class="wheel-axis axis-y"></i>
            <span class="wheel-knob" aria-hidden="true"></span>
            <button class="wheel-center" type="button" aria-label="暂停或继续">Ⅱ</button>
          </div>
          <button class="boost-button" id="boostButton" type="button" aria-label="按住加速">⚡ 按住加速</button>
        </section>

        <aside class="sidebar right-panel">
          <div class="panel-heading"><span>操作指南</span><b id="difficultyBadge">新手</b></div>
          <div class="control-row"><span class="keys"><kbd>◉</kbd></span><span>轮盘控制方向</span></div>
          <div class="control-row"><span class="keys"><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>移动蛇头</span></div>
          <div class="control-row"><span class="keys"><kbd>Shift</kbd></span><span>按住加速移动</span></div>
          <div class="control-row"><span class="keys"><kbd>Space</kbd></span><span>暂停游戏</span></div>
          <div class="divider"></div>
          <div class="challenge">
            <span class="eyebrow">今日挑战</span>
            <h3>战场幸存者</h3>
            <p>达到长度 30</p>
            <div class="progress"><i id="challengeProgress"></i></div>
            <small id="challengeText">5 / 30</small>
          </div>
        </aside>
      </section>

      <footer><span>© 2026 SNAKE ARENA</span><span>独自闯入 · 即刻开战</span></footer>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
